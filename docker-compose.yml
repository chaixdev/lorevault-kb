version: '3.8'

services:
  neo4j:
    image: neo4j:5.26
    container_name: lorevault-neo4j
    environment:
      NEO4J_AUTH: neo4j/neosecret
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
