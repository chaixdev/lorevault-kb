services:
  neo4j:
    image: neo4j:5.26
    container_name: lorevault-neo4j
    environment:
      NEO4J_AUTH: neo4j/neosecret
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  postgres:
    image: postgres:16
    container_name: lorevault-postgres
    environment:
      POSTGRES_USER: lorevault
      POSTGRES_PASSWORD: lorevault_secret
      POSTGRES_DB: lorevault_catalog
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
