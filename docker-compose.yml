version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lorevault-postgres
    environment:
      POSTGRES_DB: lorevault
      POSTGRES_USER: lorevault
      POSTGRES_PASSWORD: lorevault
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorevault -d lorevault"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
