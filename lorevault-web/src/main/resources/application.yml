# LoreVault API Configuration
server:
  port: 18080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 20
      min-spare: 5
    accept-count: 100

# Database Configuration
spring:
  config:
    import: classpath:application-common.yml
  mvc:
    async:
      request-timeout: -1
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}
    pool:
      metrics-enabled: false

  # Spring AI auto-configuration disabled - using manual bean configuration

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html
  # Include actuator endpoints in the generated OpenAPI
  show-actuator: true
  group-configs:
    - group: actuator
      paths-to-match: 
        - /actuator/**

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: "*"
        liveness:
          include: "*"

# Web-specific overrides (shared config in application-common.yml)
lorevault:
  web:
    multipart:
      # Batch ingestion sends several multipart fields per file, so Tomcat's default
      # 50-part parser limit is too low for medium-sized chapter batches.
      max-part-count: 200