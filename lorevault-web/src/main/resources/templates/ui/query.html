<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="queryError(question, mode, errorMessage)" class="space-y-3">
    <div th:if="${mode != null}" class="rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-2 text-[10px] font-semibold uppercase tracking-[0.16em] text-amber-300">
        <span th:text="${mode}">Mode</span>
    </div>

    <div class="rounded-lg border border-slate-800 bg-slate-950/60 px-3 py-3 text-xs text-slate-200">
        <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-amber-400">Question</p>
        <p class="mt-1 text-sm text-white" th:text="${question}"></p>
    </div>

    <div class="rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-3 text-xs text-amber-100">
        <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-amber-300">Search unavailable</p>
        <p class="mt-2 leading-6" th:text="${errorMessage}">Search is temporarily unavailable. Please try again.</p>
    </div>
</div>

<div th:fragment="ragResponse(question, response)" class="space-y-3">
    <div th:if="${mode != null}" class="rounded-lg border border-emerald-500/30 bg-emerald-500/10 px-3 py-2 text-[10px] font-semibold uppercase tracking-[0.16em] text-emerald-300">
        <span th:text="${mode}">Mode</span>
    </div>

    <div class="rounded-lg border border-slate-800 bg-slate-950/60 px-3 py-3 text-xs text-slate-200">
        <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-emerald-400">Question</p>
        <p class="mt-1 text-sm text-white" th:text="${question}"></p>
    </div>

    <div class="rounded-lg border border-slate-800 bg-slate-950/60 px-3 py-3 text-xs text-slate-300">
        <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-500">Answer</p>
        <p class="mt-2 whitespace-pre-wrap leading-6" th:text="${response.answer}"></p>
    </div>

    <div th:if="${response.citations != null && !response.citations.isEmpty()}" class="space-y-2">
        <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-500">Citations</p>
        <div th:each="citation : ${response.citations}" class="rounded-lg border border-slate-800 bg-slate-950/40 px-3 py-2 text-[11px] text-slate-400">
            <p class="font-mono text-slate-500" th:text="${citation.chunkId}"></p>
            <p class="mt-1 text-slate-300" th:text="${citation.snippet}"></p>
        </div>
    </div>
</div>

<div th:fragment="vectorResponse(question, response)" class="space-y-3">
    <div th:if="${mode != null}" class="rounded-lg border border-sky-500/30 bg-sky-500/10 px-3 py-2 text-[10px] font-semibold uppercase tracking-[0.16em] text-sky-300">
        <span th:text="${mode}">Mode</span>
    </div>

    <div class="rounded-lg border border-slate-800 bg-slate-950/60 px-3 py-3 text-xs text-slate-200">
        <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-sky-400">Question</p>
        <p class="mt-1 text-sm text-white" th:text="${question}"></p>
    </div>

    <div th:if="${response.results != null && !response.results.isEmpty()}" class="space-y-2">
        <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-500">Top Vector Matches</p>
        <div th:each="result : ${response.results}" class="rounded-lg border border-slate-800 bg-slate-950/40 px-3 py-2 text-[11px] text-slate-400 space-y-1">
            <div class="flex items-center justify-between">
                <p class="font-mono text-slate-500" th:text="${result.chunkId}"></p>
                <p class="text-sky-300 font-semibold" th:text="${#numbers.formatDecimal(result.score, 1, 3)}"></p>
            </div>
            <p class="text-slate-300" th:text="${result.snippet}"></p>
        </div>
    </div>

    <div th:if="${response.results == null || response.results.isEmpty()}" class="rounded-lg border border-dashed border-slate-700 bg-slate-950/40 px-3 py-4 text-center text-[11px] text-slate-500">
        No vector matches found.
    </div>
</div>
</body>
</html>
