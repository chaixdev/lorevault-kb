# Disable startup health checks to avoid any external calls during tests
lorevault.system.health.startup.enabled=false
spring.main.banner-mode=off
spring.main.log-startup-info=false

# Also disable individual health check paths as a second safeguard
lorevault.llm.health.enabled=false
lorevault.embedding.health.enabled=false

# Quieter logging
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.testcontainers=WARN
logging.level.org.neo4j.driver=ERROR
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR
logging.level.com.lorevault.api.config.Neo4jSchemaInitializer=OFF
logging.level.com.lorevault.api.config.SchemaBootstrapConfiguration=WARN
logging.level.com.lorevault.api.search.entityextraction=ERROR
logging.level.com.lorevault=INFO
logging.level.org.springframework.ai=ERROR
