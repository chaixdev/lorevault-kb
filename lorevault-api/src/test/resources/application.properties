# Disable any external health checks during tests
lorevault.llm.health.enabled=false
lorevault.embedding.health.enabled=false

# Use in-memory / defaults where possible to avoid hitting network in tests
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=neo4j

# Quieter logging for tests
logging.level.com.lorevault=INFO
logging.level.org.springframework.ai=ERROR
lorevault.system.health.startup.enabled=false
