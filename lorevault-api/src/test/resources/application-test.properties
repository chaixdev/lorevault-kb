# Test Configuration - Neo4j migration phase (no RDBMS)

# Disable DataSource auto configuration since JPA remains temporarily but DB removed
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Logging
logging.level.com.lorevault=DEBUG
logging.level.org.springframework.web=INFO

# Neo4j connection is provided dynamically by Testcontainers via IntegrationTestBase
# (spring.neo4j.uri, username, password populated at runtime)

# Reduce noise
debug=false
