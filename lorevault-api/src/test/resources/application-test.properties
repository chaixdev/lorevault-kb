# Ensure Spring uses the 'test' profile when running tests that activate it
spring.profiles.active=test

# Disable startup health checks to avoid any external calls during tests
lorevault.system.health.startup.enabled=false

# Also disable individual health check paths as a second safeguard
lorevault.llm.health.enabled=false
lorevault.embedding.health.enabled=false

# Quieter logging
logging.level.com.lorevault=INFO
logging.level.org.springframework.ai=ERROR
