# Application Configuration
server.port=18080
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:15432/lorevault
spring.datasource.username=lorevault
spring.datasource.password=lorevault
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Application Info
info.app.name=LoreVault API
info.app.description=An Agentic Knowledge Ingestion Service
info.app.version=1.0.0-SNAPSHOT
