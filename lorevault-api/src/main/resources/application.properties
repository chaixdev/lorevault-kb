# Application Configuration
server.port=18080
server.servlet.context-path=/

# Tomcat Configuration for better concurrency during debugging
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=100

# Transaction management
spring.jpa.properties.hibernate.connection.isolation=2

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:15432/lorevault
spring.datasource.username=lorevault
spring.datasource.password=lorevault
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Spring AI - Gemini via OpenAI compatibility endpoint
spring.ai.openai.api-key=${GEMINI_AI_API_KEY:your-api-key-here}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=gemini-2.5-flash-lite

# AI Prompts Configuration
lorevault.ai.prompts.base-path=classpath:prompts
lorevault.ai.prompts.scene-detection=scene-detection-v2.txt

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Text Chunking Configuration
# Decision threshold for single chunk vs multi-chunk (Stage 3 of text-chunking-specification.md)
lorevault.chunking.decision-threshold=5000
# Target chunk size for multi-chunk processing (Stage 4B)
lorevault.chunking.target-size=3000
# Overlap percentage between consecutive chunks (15% = specification compliant)
lorevault.chunking.overlap-percentage=15
# Minimum chunk size (specification: 2000-4000 character range)
lorevault.chunking.min-chunk-size=2000
# Maximum chunk size (specification: 2000-4000 character range)
lorevault.chunking.max-chunk-size=4000
