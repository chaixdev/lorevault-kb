# LoreVault API Configuration
server:
  port: 18080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 20
      min-spare: 5
    accept-count: 100

# Database Configuration
spring:
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}
    pool:
      metrics-enabled: false

  # Spring AI auto-configuration disabled - using manual bean configuration

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html
  # Include actuator endpoints in the generated OpenAPI
  show-actuator: true
  group-configs:
    - group: actuator
      paths-to-match: 
        - /actuator/**

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: "*"
        liveness:
          include: "*"

# LoreVault Configuration (cleaned)
lorevault:
  # Schema initialization - disabled by default (enabled in dev profile)
  schema:
    enabled: false
    mode: none
    backend: neo4j
    fail-on-error: false
  
  # LLM settings used by existing services
  ai:
    # Retry config (for repeating failed requests)
    retry:
      max-attempts: 3
      base-delay-ms: 1000
      backoff-multiplier: 2.0
      max-delay-ms: 10000
      jitter-factor: 0.1

    models:
    # Embedding model configuration (Gemini OpenAI-compatible)
      embedding:
        provider: openai-compatible
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        api-key: ${GEMINI_AI_API_KEY:}
        model: gemini-embedding-001
        # Embedding-specific options can be added here in the future if needed

      # Small/cheap chat model slot
      nlp-small:
        provider: openai-compatible
        base-url: https://api.groq.com/openai/v1
        completions-path: /chat/completions
        api-key: ${GROQ_API_KEY}
        model: openai/gpt-oss-120b
        temperature: 0.3
        top-p: 1.0
        max-tokens: 2048

      # Powerful chat model slot (also used as failover if small fails)
      nlp-big:
        provider: openai-compatible
        base-url: https://api.groq.com/openai/v1
        completions-path: /chat/completions
        api-key: ${GROQ_API_KEY}
        model: openai/gpt-oss-120b
        temperature: 0.2
        top-p: 1.0
        max-tokens: 4096

    # Prompt locations (used by PromptLoaderService)
    prompts:
      base-path: classpath:prompts
      # scene-detection: 
      #   system-prompt: scene-detection-v2.txt
      #   model: nlp-small
      scene-detection-pass1: 
        system-prompt: scene-detection-pass1.txt
        model: nlp-big
      scene-detection-pass2: 
        system-prompt: scene-detection-pass2.txt
        model: nlp-small
      entity-extraction: 
        system-prompt: entity-extraction.txt
        model: nlp-big
      rag-answer-generation:
        system-prompt: rag-answer-generation.txt
        model: nlp-big

  # Text chunking settings (aligned with TextChunkingService @Value keys)
  content:
    chunking:
      decision-threshold: 1500  # Lower threshold for smaller chunks (was 5000)
      target-size: 800         # 800 char chunks with padding (was 3000)
      overlap-percentage: 25   # 200 chars each side = 25% of 800 (was 15%)
      min-chunk-size: 400      # Allow smaller chunks for scene boundaries (was 2000)
      max-chunk-size: 1200     # Upper bound with padding (was 4000)

  # Embedding configuration (configured to request 1536 dimensions from Gemini)
  embedding:
    model:
      provider: openai-compatible
      model: gemini-embedding-001
      dimensions: 1536  # Request 1536 dimensions from Gemini (configurable via API)
      batch-size: 32

  # Semantic search configuration
  search:
    provider: neo4j  # Options: neo4j (default), memory
    snippet:
      # Maximum characters per snippet returned from search, used in RAG context.
      # With smaller 800-char chunks, we can return full chunks instead of snippets.
      max-length: 800
    neo4j:
      vector-index-name: chunk_embedding_idx
      similarity-function: cosine
      dimensions: 1536

  # Multi-LLM provider configuration (disabled by default, requires valid structure for properties binding)
  multi-llm:
    enabled: false  # Feature disabled
    retry:
      max-attempts: 3
      base-delay-ms: 1000
      max-delay-ms: 10000
      backoff-multiplier: 2.0
      jitter-factor: 0.1
    providers:
      default:
        name: default
        base-url: http://localhost
        api-key: unused
        chat-model: unused
        temperature: 0.7
        top-p: 1.0
        max-tokens: 2048
    prompts:
      base-path: classpath:prompts
      scene-detection: scene-detection.md
    tasks:
      embeddings:
        primary: default
        fallback: default
      extract-scenes:
        primary: default
        fallback: default

  