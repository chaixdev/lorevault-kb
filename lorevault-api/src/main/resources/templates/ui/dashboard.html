<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoreVault - Operator Console</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.2/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        
        /* Custom scrollbar for narrow columns */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 10px;
        }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb {
            background-color: #475569;
        }
    </style>
</head>
<body class="bg-[#0f1117] text-slate-100 flex flex-col h-screen overflow-hidden">

    <!-- Top Header -->
    <header class="h-14 border-b border-slate-800 bg-slate-950 flex-shrink-0 flex items-center justify-between px-6 z-10">
        <div class="flex items-center gap-3">
            <div class="flex h-7 w-7 items-center justify-center rounded bg-emerald-500/20 border border-emerald-500/30">
                <svg class="h-4 w-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
            </div>
            <div class="flex items-baseline gap-3">
                <h1 class="text-sm font-bold text-white tracking-wide">LOREVAULT</h1>
                <span class="text-[10px] font-medium text-slate-500 uppercase tracking-widest">Operator Console</span>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 px-3 py-1 rounded bg-emerald-500/10 border border-emerald-500/20">
                <div class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></div>
                <span class="text-[10px] font-medium text-emerald-400 uppercase tracking-wider">System Online</span>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 flex overflow-hidden p-4 sm:p-6 gap-6 max-w-[1600px] mx-auto w-full"
          x-data="operatorLayout()">
        
        <!-- Left Column: Context & Upload -->
        <div class="flex-shrink-0 flex gap-3 min-h-0"
             :class="leftRailCollapsed ? 'w-14' : 'w-80 lg:w-96'">
            <button type="button"
                    class="mt-2 inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-slate-800 bg-slate-900/70 text-emerald-300 shadow-xl transition hover:border-slate-700 hover:bg-slate-800"
                    @click="leftRailCollapsed = !leftRailCollapsed"
                    :title="leftRailCollapsed ? 'Expand upload rail' : 'Collapse upload rail'">
                <svg class="h-4 w-4 transition-transform" :class="leftRailCollapsed ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>

            <div class="flex-1 min-h-0 overflow-y-auto pr-1 custom-scrollbar pb-6" x-show="!leftRailCollapsed" x-cloak>
                <div id="chapter-upload-panel" th:replace="~{ui/ingestion :: uploadForm(message=${uploadMessage}, messageType=${uploadMessageType}, chapterUploadForm=${chapterUploadForm})}"></div>
            </div>
        </div>

        <!-- Center Column: Jobs Stream -->
        <div class="flex-1 flex flex-col min-w-0 bg-slate-900/50 rounded-xl border border-slate-800 shadow-2xl overflow-hidden relative">
            <!-- Header -->
            <div class="flex items-center justify-between border-b border-slate-800 px-5 py-3.5 bg-slate-900/80 shrink-0">
                <div class="flex items-center gap-2">
                    <svg class="h-4 w-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <h3 class="text-sm font-semibold text-slate-200">Active Job Stream</h3>
                </div>
                <button type="button"
                        class="inline-flex items-center gap-1.5 rounded border border-slate-700 bg-slate-800 px-2.5 py-1 text-[10px] font-medium text-slate-300 transition hover:bg-slate-700 hover:text-white"
                        th:hx-get="@{/ui/jobs}"
                        hx-target="#jobs-table"
                        hx-swap="innerHTML">
                    <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 11-3-6.708" stroke-linecap="round" stroke-linejoin="round"></path>
                        <polyline points="21 4 21 10 15 10" stroke-linecap="round" stroke-linejoin="round"></polyline>
                    </svg>
                    Sync
                </button>
            </div>
            
            <!-- Jobs container -->
            <div id="jobs-table"
                 class="flex-1 overflow-y-auto p-0 custom-scrollbar"
                 th:hx-get="@{/ui/jobs}"
                 hx-trigger="load, refresh-jobs from:body every 5s"
                 hx-target="this"
                 hx-swap="innerHTML">
                 <div class="p-6 flex items-center justify-center gap-3 text-slate-500 text-xs h-full">
                     <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                         <circle class="opacity-25" cx="12" cy="12" r="10"></circle>
                         <path class="opacity-75" d="M4 12a8 8 0 018-8"></path>
                     </svg>
                     Establishing telemetry link...
                 </div>
            </div>
        </div>

        <!-- Right Column: Operator Tools -->
        <div class="w-80 flex-shrink-0 flex flex-col gap-6 overflow-hidden">
            
            <!-- Q&A Panel -->
            <div class="flex flex-col h-[54%] rounded-xl border border-slate-800 bg-slate-900/50 shadow-xl overflow-hidden shrink-0">
                <div class="px-4 py-3 border-b border-slate-800 bg-slate-900/80 flex items-center gap-2 shrink-0">
                    <svg class="h-4 w-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    <h3 class="text-sm font-semibold text-slate-200">Operator Q&A</h3>
                </div>
                <div class="flex-1 flex flex-col overflow-hidden bg-slate-900/30">
                    <div id="qa-results" class="flex-1 overflow-y-auto p-4 custom-scrollbar">
                        <div class="rounded-lg border border-dashed border-slate-700 bg-slate-950/40 px-3 py-4 text-center text-[11px] text-slate-500">
                            Ask a quick validation question against the current graph.
                        </div>
                    </div>
                    <form th:hx-post="@{/ui/query/ask/rag}"
                          hx-target="#qa-results"
                          hx-swap="innerHTML"
                          class="border-t border-slate-800 p-3 space-y-2">
                        <input type="text"
                               name="question"
                               placeholder="Query the lore graph..."
                               class="w-full rounded-lg border border-slate-700 bg-slate-950/80 px-3 py-2 text-xs text-white placeholder-slate-600 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500/40">
                        <input type="hidden" name="topK" value="5">
                        <button type="submit"
                                class="inline-flex w-full items-center justify-center rounded-lg border border-emerald-500/30 bg-emerald-500/10 px-3 py-2 text-[11px] font-semibold text-emerald-300 transition hover:bg-emerald-500/20">
                            Ask
                        </button>
                    </form>
                </div>
            </div>

            <!-- Event Console Panel -->
            <div class="flex-1 flex flex-col max-h-[32%] rounded-xl border border-slate-800 bg-slate-950 shadow-xl overflow-hidden font-mono min-h-0">
                <div class="px-4 py-2 border-b border-slate-800 bg-slate-900 flex items-center justify-between shrink-0">
                    <div class="flex items-center gap-2">
                        <div class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                        <span class="text-slate-400 font-semibold uppercase tracking-wider text-[9px]">Live Feed</span>
                    </div>
                    <span class="text-slate-600 text-[9px]">/api/query/jobs/stream</span>
                </div>
                <div class="flex-1 overflow-hidden bg-[#0a0c10]">
                    <div class="h-full overflow-y-auto custom-scrollbar p-4 space-y-1.5 text-[10px]"
                         x-data="jobEventConsole()"
                         x-init="connect()">
                        <template x-for="item in entries" :key="item.id">
                            <div class="flex gap-2.5 hover:bg-white/5 px-1 rounded -mx-1 py-0.5">
                                <span class="text-slate-600 shrink-0" x-text="item.time"></span>
                                <span class="w-10 shrink-0 font-semibold" :class="item.tagClass" x-text="item.tag"></span>
                                <span class="text-slate-400 break-words" x-text="item.message"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <script>
        function operatorLayout() {
            return {
                leftRailCollapsed: false
            };
        }

        function jobEventConsole() {
            return {
                entries: [
                    { id: 'boot-1', time: '--:--:--', tag: 'SYS', tagClass: 'text-blue-400', message: 'Waiting for SSE connection...' }
                ],
                eventSource: null,
                connect() {
                    if (!window.EventSource) {
                        this.push('ERR', 'text-rose-400', 'EventSource not supported in this browser.');
                        return;
                    }
                    this.eventSource = new EventSource('/api/query/jobs/stream');
                    this.eventSource.addEventListener('status-update', (event) => {
                        try {
                            const payload = JSON.parse(event.data);
                            this.push(this.tagFor(payload.eventType), this.tagClassFor(payload.eventType), this.describe(payload));
                            if (payload.jobId) {
                                htmx.trigger(document.body, 'refresh-jobs');
                            }
                        } catch (error) {
                            this.push('ERR', 'text-rose-400', 'Failed to parse SSE payload');
                        }
                    });
                    this.eventSource.onopen = () => this.push('SSE', 'text-emerald-400', 'Telemetry stream connected');
                    this.eventSource.onerror = () => this.push('SSE', 'text-amber-400', 'Telemetry stream interrupted; browser will retry');
                },
                push(tag, tagClass, message) {
                    const now = new Date();
                    this.entries.unshift({
                        id: `${Date.now()}-${Math.random()}`,
                        time: now.toLocaleTimeString('en-US', { hour12: false }),
                        tag,
                        tagClass,
                        message
                    });
                    if (this.entries.length > 60) {
                        this.entries = this.entries.slice(0, 60);
                    }
                },
                tagFor(type) {
                    if (!type) return 'EVT';
                    const compact = type.replace(/[^A-Z]/g, '').slice(0, 4);
                    return compact || 'EVT';
                },
                tagClassFor(type) {
                    if (!type) return 'text-slate-400';
                    if (type.includes('FAILED')) return 'text-rose-400';
                    if (type.includes('COMPLETE')) return 'text-emerald-400';
                    if (type.includes('SCENE')) return 'text-violet-400';
                    if (type.includes('CHUNK')) return 'text-sky-400';
                    return 'text-blue-400';
                },
                describe(payload) {
                    if (!payload || !payload.eventType) return 'Unknown job event';
                    const bits = [payload.eventType];
                    if (payload.chapterId) bits.push(`chapter ${String(payload.chapterId).slice(0, 8)}`);
                    if (payload.jobId) bits.push(`job ${String(payload.jobId).slice(0, 8)}`);
                    if (payload.sceneCount != null) bits.push(`${payload.sceneCount} scenes`);
                    if (payload.chunkCount != null) bits.push(`${payload.chunkCount} chunks`);
                    if (payload.failedStage) bits.push(`failed at ${payload.failedStage}`);
                    if (payload.errorMessage) bits.push(payload.errorMessage);
                    return bits.join(' • ');
                }
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener('refresh-universes', () => {
                document.querySelectorAll('[data-universe-options]')?.forEach(select => {
                    htmx.trigger(select, 'refresh');
                });
            });

            document.body.addEventListener('refresh-series', () => {
                document.querySelectorAll('[data-series-options]')?.forEach(select => {
                    htmx.trigger(select, 'refresh');
                });
            });

            document.body.addEventListener('refresh-books', () => {
                document.querySelectorAll('[data-book-options]')?.forEach(select => {
                    htmx.trigger(select, 'refresh');
                });
            });
        });
    </script>
</body>
</html>
