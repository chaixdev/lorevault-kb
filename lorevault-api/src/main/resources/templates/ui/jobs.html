<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="jobTable(jobs, pagination)" class="space-y-4">
    <div th:if="${jobs == null || jobs.isEmpty()}"
         class="rounded-lg border border-dashed border-slate-700 bg-slate-900/40 px-6 py-12 text-center">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-slate-800/50">
            <svg class="h-8 w-8 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
        </div>
        <h3 class="mt-4 text-base font-semibold text-slate-300">No jobs yet</h3>
        <p class="mt-2 text-sm text-slate-500">Upload a chapter to see processing jobs appear here</p>
    </div>

    <div th:if="${jobs != null && !jobs.isEmpty()}" class="overflow-hidden rounded-xl border border-slate-800 shadow-xl">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-800">
                <thead class="bg-gradient-to-r from-slate-900 to-slate-800/80">
                    <tr class="text-left text-xs font-semibold uppercase tracking-wider text-slate-400">
                        <th class="px-4 py-3.5">Content</th>
                        <th class="px-4 py-3.5">Location</th>
                        <th class="px-4 py-3.5">Status</th>
                        <th class="px-4 py-3.5">Progress</th>
                        <th class="px-4 py-3.5">Timeline</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800 bg-slate-900/40">
                    <tr th:each="job : ${jobs}" class="transition hover:bg-slate-800/30">
                        <!-- Content Column -->
                        <td class="px-4 py-4">
                            <div class="flex items-start gap-3">
                                <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-emerald-500/10">
                                    <svg class="h-5 w-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                    </svg>
                                </div>
                                <div class="min-w-0">
                                    <p class="font-medium text-white truncate" th:text="${job.chapterTitle}"></p>
                                    <p class="mt-0.5 text-xs text-slate-400">
                                        <span th:if="${job.chapterNumber != null}" th:text="'Chapter ' + ${job.chapterNumber}"></span>
                                    </p>
                                </div>
                            </div>
                        </td>
                        
                        <!-- Location Column -->
                        <td class="px-4 py-4">
                            <div class="space-y-1 text-sm">
                                <p class="flex items-center gap-1.5 text-slate-200">
                                    <svg class="h-3.5 w-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    <span th:text="${job.universe != null ? job.universe : 'N/A'}"></span>
                                </p>
                                <p th:if="${job.series != null}" class="flex items-center gap-1.5 text-slate-400">
                                    <svg class="h-3.5 w-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                                    </svg>
                                    <span th:text="${job.series}"></span>
                                </p>
                                <p th:if="${job.bookNumber != null}" class="flex items-center gap-1.5 text-slate-500 text-xs">
                                    Book #<span th:text="${job.bookNumber}"></span>
                                </p>
                            </div>
                        </td>
                        
                        <!-- Status Column -->
                        <td class="px-4 py-4">
                            <span th:with="statusName=${job.status?.name()}"
                                  th:class="'inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ' + 
                                           (${statusName == 'COMPLETE'} ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 
                                           (${statusName == 'FAILED'} ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 
                                           (${statusName == 'PROCESSING'} ? 'bg-blue-500/20 text-blue-300 border border-blue-500/30' : 
                                           'bg-amber-500/20 text-amber-300 border border-amber-500/30')))">
                                <span th:if="${statusName == 'COMPLETE'}" class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
                                <span th:if="${statusName == 'FAILED'}" class="h-1.5 w-1.5 rounded-full bg-rose-400"></span>
                                <span th:if="${statusName == 'PROCESSING'}" class="h-1.5 w-1.5 rounded-full bg-blue-400 animate-pulse"></span>
                                <span th:if="${statusName != 'COMPLETE' && statusName != 'FAILED' && statusName != 'PROCESSING'}" class="h-1.5 w-1.5 rounded-full bg-amber-400"></span>
                                <span th:text="${job.status != null ? job.status.name() : 'UNKNOWN'}"></span>
                            </span>
                        </td>
                        
                        <!-- Progress Column -->
                        <td class="px-4 py-4">
                            <div class="flex items-center gap-3">
                                <div class="h-2 flex-1 rounded-full bg-slate-800 overflow-hidden">
                                    <div class="h-full rounded-full bg-gradient-to-r from-emerald-500 to-emerald-400 transition-all duration-500"
                                         th:style="${job.progress != null ? 'width:' + job.progress + '%' : 'width:0%'}"></div>
                                </div>
                                <span class="text-xs font-medium text-slate-300 w-10 text-right" 
                                      th:text="${job.progress != null ? job.progress + '%' : '0%'}"></span>
                            </div>
                        </td>
                        
                        <!-- Timeline Column -->
                        <td class="px-4 py-4">
                            <div class="space-y-1 text-xs">
                                <div class="flex items-center gap-1.5 text-slate-400">
                                    <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                    </svg>
                                    <span th:text="${job.createdAt != null ? #temporals.format(job.createdAt, 'MMM dd, HH:mm') : 'N/A'}"></span>
                                </div>
                                <div th:if="${job.completedAt != null}" class="flex items-center gap-1.5 text-emerald-400">
                                    <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                    <span th:text="${#temporals.format(job.completedAt, 'MMM dd, HH:mm')}"></span>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${pagination != null && pagination.hasMore}" 
         class="text-center rounded-lg border border-slate-800 bg-slate-900/40 px-4 py-3">
        <p class="text-xs text-slate-500">
            Showing the latest <span class="font-semibold text-slate-400" th:text="${pagination.limit}"></span> jobs. 
            More results available from the API.
        </p>
    </div>
</div>
</body>
</html>
