<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="uploadForm(universes, books, message, messageType)"
     id="chapter-upload-panel"
     class="rounded-xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl">
    <div class="flex items-center gap-3 mb-4">
        <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-gradient-to-br from-amber-500/20 to-amber-600/20">
            <svg class="h-7 w-7 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
        </div>
        <div>
            <h2 class="text-xl font-semibold text-white">Upload Chapter</h2>
            <p class="text-sm text-slate-400">Add a chapter file to your book</p>
        </div>
    </div>

    <form th:object="${chapterUploadForm}"
          class="space-y-5"
          th:hx-post="@{/ui/ingest/chapter}"
          hx-target="#chapter-upload-panel"
          hx-swap="outerHTML"
          hx-encoding="multipart/form-data"
          enctype="multipart/form-data"
          x-data="{ fileName: '' }">
        
        <div>
            <label for="upload-universe" class="block text-sm font-medium text-slate-200">Universe</label>
            <select id="upload-universe"
                    th:field="*{universeId}"
                    name="universeId"
                    class="mt-2 w-full rounded-lg border border-white/10 bg-slate-950/80 px-3 py-2.5 text-sm text-white transition focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-500/40"
                    data-universe-options
                    th:hx-get="@{/ui/library/options/universes}"
                    hx-trigger="load, refresh"
                    hx-target="this"
                    hx-swap="innerHTML"
                    hx-on="change: (function(){ const target = document.querySelector('#upload-book'); if(target){ target.value=''; htmx.trigger(target, 'refresh'); }})();">
                <option value="" th:text="${universes == null || universes.isEmpty() ? 'No universes available' : 'Select a universe...'}"
                        th:selected="${chapterUploadForm.universeId == null}"></option>
                <option th:each="universe : ${universes}"
                        th:value="${universe.id}"
                        th:text="${universe.name}"
                        th:selected="${chapterUploadForm.universeId != null and chapterUploadForm.universeId.equals(universe.id)}"></option>
            </select>
            <p th:if="${#fields.hasErrors('universeId')}"
               class="mt-2 flex items-center gap-1.5 text-sm text-rose-400">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span th:text="${#fields.errors('universeId')[0]}"></span>
            </p>
        </div>

        <div>
            <label for="upload-book" class="block text-sm font-medium text-slate-200">Book</label>
            <select id="upload-book"
                    th:field="*{bookId}"
                    name="bookId"
                    class="mt-2 w-full rounded-lg border border-white/10 bg-slate-950/80 px-3 py-2.5 text-sm text-white transition focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-500/40"
                    data-book-options
                    th:hx-get="@{/ui/library/options/books}"
                    hx-trigger="load, refresh"
                    hx-target="this"
                    hx-swap="innerHTML"
                    hx-include="#upload-universe">
                <option value="" th:selected="${chapterUploadForm.bookId == null}">Select a book...</option>
                <option th:each="book : ${books}"
                        th:value="${book.id}"
                        th:text="${book.displayLabel()}"
                        th:selected="${chapterUploadForm.bookId != null and chapterUploadForm.bookId.equals(book.id)}"></option>
            </select>
            <p th:if="${#fields.hasErrors('bookId')}"
               class="mt-2 flex items-center gap-1.5 text-sm text-rose-400">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span th:text="${#fields.errors('bookId')[0]}"></span>
            </p>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
            <div>
                <label for="chapter-number" class="block text-sm font-medium text-slate-200">Chapter number</label>
                <input id="chapter-number"
                       th:field="*{chapterNumber}"
                       name="chapterNumber"
                       type="number"
                       min="1"
                       placeholder="1"
                       class="mt-2 w-full rounded-lg border border-white/10 bg-slate-950/80 px-3 py-2.5 text-sm text-white placeholder-slate-500 transition focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-500/40"/>
                <p th:if="${#fields.hasErrors('chapterNumber')}"
                   class="mt-2 flex items-center gap-1.5 text-sm text-rose-400">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span th:text="${#fields.errors('chapterNumber')[0]}"></span>
                </p>
            </div>
            <div>
                <label for="chapter-title" class="block text-sm font-medium text-slate-200">
                    Chapter title <span class="text-xs text-slate-500">(optional)</span>
                </label>
                <input id="chapter-title"
                       th:field="*{chapterTitle}"
                       name="chapterTitle"
                       type="text"
                       placeholder="Auto-detected from filename"
                       class="mt-2 w-full rounded-lg border border-white/10 bg-slate-950/80 px-3 py-2.5 text-sm text-white placeholder-slate-500 transition focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-500/40"/>
                <p th:if="${#fields.hasErrors('chapterTitle')}"
                   class="mt-2 flex items-center gap-1.5 text-sm text-rose-400">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span th:text="${#fields.errors('chapterTitle')[0]}"></span>
                </p>
            </div>
        </div>

        <div>
            <label for="chapter-file" class="block text-sm font-medium text-slate-200 mb-2">Chapter file</label>
            <div class="relative">
                <input id="chapter-file"
                       th:field="*{file}"
                       name="file"
                       type="file"
                       accept=".txt,.md"
                       @change="fileName = $event.target.files[0]?.name || ''"
                       class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"/>
                <div class="relative rounded-lg border-2 border-dashed border-slate-700 bg-slate-950/50 px-6 py-8 text-center transition hover:border-amber-400/50 hover:bg-slate-950/80">
                    <svg class="mx-auto h-12 w-12 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="mt-3 text-sm text-slate-300">
                        <span class="font-medium text-amber-400">Click to upload</span> or drag and drop
                    </p>
                    <p class="mt-1 text-xs text-slate-500" x-text="fileName || '.txt or .md files, max 1MB'"></p>
                </div>
            </div>
            <p th:if="${#fields.hasErrors('file')}"
               class="mt-2 flex items-center gap-1.5 text-sm text-rose-400">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span th:text="${#fields.errors('file')[0]}"></span>
            </p>
        </div>

        <div th:if="${#fields.hasGlobalErrors()}"
             class="rounded-lg border border-rose-500/40 bg-rose-500/10 px-3 py-2.5 text-sm text-rose-200">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div th:if="${message != null}"
             th:classappend=" ${messageType} == 'success' ? 'border-emerald-500/30 bg-emerald-500/10 text-emerald-200' : 'border-slate-500/40 bg-slate-500/10 text-slate-200'"
             class="rounded-lg border px-3 py-2.5 text-sm flex items-start gap-2">
            <svg th:if="${messageType} == 'success'" class="h-5 w-5 text-emerald-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <svg th:if="${messageType} != 'success'" class="h-5 w-5 text-blue-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p th:text="${message}"></p>
        </div>

        <div class="pt-2">
            <button type="submit"
                    class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-gradient-to-r from-amber-500 to-amber-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-amber-500/20 transition hover:from-amber-400 hover:to-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-500/40">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                Upload & Queue for Processing
            </button>
        </div>
    </form>

    <th:block th:if="${triggerJobRefresh}">
        <script>htmx.trigger(document.body, 'refresh-jobs');</script>
    </th:block>
</div>
</body>
</html>
